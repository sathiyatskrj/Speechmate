name: speechmate
description: "A bilingual Dictionary for Nicobarian translation"
publish_to: 'none'
version: 1.4.0+4

environment:
  sdk: ">=3.2.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.3
  audioplayers: ^6.5.1
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  rive: ^0.13.0
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  speech_to_text: ^7.3.0
  record: 5.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  google_fonts: ^6.1.0
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.2
  ffi: ^2.1.2
  sqflite: ^2.3.0
  path: ^1.8.3
  pdf: ^3.10.8
  printing: ^5.11.1
  archive: ^3.3.7
  qr_flutter: ^4.1.0
  appinio_swiper: ^2.1.1
  fl_chart: ^1.2.0
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: 2.4.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_main.png"
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  image: assets/icons/logo_main.png
  branding: assets/icons/branding.png
  color: "#ffffff"
  android: true
  ios: true
  android_12:
    color: "#ffffff"
    image: assets/icons/logo_main.png
    branding: assets/icons/branding.png
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/data/dictionary.json
    - assets/icons/logo_main.png
    - assets/audio/numbers/
    - assets/audio/phrases/
    - assets/audio/words/
    - assets/audio/nature/
    - assets/audio/body_parts/
    - assets/audio/colors/
    - assets/audio/things/
    - assets/audio/feelings/
    - assets/images/
    - assets/data/dictionary_phrases.json
    - assets/data/dictionary_animals.json
    - assets/data/dictionary_magic.json
    - assets/audio/magic/
    - assets/audio/animals/
    - assets/audio/family/ 
    - assets/data/dictionary_family.json 
    - assets/icons/branding.png
    - assets/models/ggml-tiny.en.bin
    - assets/data/dictionary_dialects.json

dependency_overrides:
  record_linux: ^1.2.0
