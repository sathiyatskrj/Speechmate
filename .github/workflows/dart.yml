env:
  APP_VERSION: 1.4.9

name: Build & Release

on:
  push:
    branches: [ "main", "speechmate_general" ]
  pull_request:
    branches: [ "main", "speechmate_general" ]
  workflow_dispatch:  # Allow manual trigger

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Android — Universal APK + Compact arm64 APK + AAB
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-android:
    name: 🤖 Build Android
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true  # Pull Git LFS files (whisper model)

      # ── Determine edition name based on branch ─────────────────────────────
      - name: Set edition variables
        run: |
          if [ "${{ github.ref_name }}" = "speechmate_general" ]; then
            echo "EDITION=General" >> $GITHUB_ENV
            echo "APP_NAME=SpeechMate-General" >> $GITHUB_ENV
            echo "RELEASE_TITLE=SpeechMate General v${{ env.APP_VERSION }} (Public Edition)" >> $GITHUB_ENV
            echo "TAG_SUFFIX=-public" >> $GITHUB_ENV
            echo "RELEASE_DESC=General Public Edition — For common people, tourists, and language enthusiasts." >> $GITHUB_ENV
          else
            echo "EDITION=Institutional" >> $GITHUB_ENV
            echo "APP_NAME=SpeechMate" >> $GITHUB_ENV
            echo "RELEASE_TITLE=SpeechMate v${{ env.APP_VERSION }} (Institutional Edition)" >> $GITHUB_ENV
            echo "TAG_SUFFIX=" >> $GITHUB_ENV
            echo "RELEASE_DESC=Institutional Edition — For students and teachers in tribal language classrooms." >> $GITHUB_ENV
          fi

      - name: Verify LFS model
        run: |
          echo "Checking ggml-base.bin..."
          ls -lh assets/models/
          FILE_SIZE=$(stat -f%z assets/models/ggml-base.bin 2>/dev/null || stat -c%s assets/models/ggml-base.bin 2>/dev/null || echo 0)
          if [ "$FILE_SIZE" -lt 100000000 ]; then
            echo "ERROR: ggml-base.bin is too small ($FILE_SIZE bytes). LFS pull may have failed."
            echo "Attempting manual LFS pull..."
            git lfs pull
            ls -lh assets/models/
          fi
          echo "Model file OK."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses & install NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      # ── Universal APK (fat APK: arm32 + arm64, works on any Android) ──────
      - name: Build Universal APK
        run: flutter build apk --release

      # ── Compact APK (arm64-v8a only, ~40-50% smaller, modern phones only) ─
      - name: Build Compact APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      # ── AAB for Google Play Store ─────────────────────────────────────────
      - name: Build AAB
        run: flutter build appbundle --release

      # ── Rename all outputs with edition-aware names ────────────────────────
      - name: Rename artifacts
        run: |
          # Universal APK
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-universal.apk

          # Compact APK (arm64 split)
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-compact-arm64.apk

          # AAB
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}.aab

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-Universal-APK
          path: build/app/outputs/flutter-apk/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-universal.apk

      - name: Upload Compact APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-Compact-arm64-APK
          path: build/app/outputs/flutter-apk/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-compact-arm64.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-AAB
          path: build/app/outputs/bundle/release/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}.aab

      - name: Create GitHub Release (Android)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.RELEASE_TITLE }}"
          tag_name: "v${{ env.APP_VERSION }}${{ env.TAG_SUFFIX }}"
          body: |
            ## 📦 ${{ env.RELEASE_TITLE }}
            
            > ${{ env.RELEASE_DESC }}
            
            ### Downloads
            | Build | Description | Size (approx) |
            |-------|-------------|---------------|
            | **Universal APK** | Works on ALL Android devices (arm32 + arm64) | ~250 MB |
            | **Compact APK** | Modern phones only (arm64, Android 5.0+) | ~150 MB |
            | **AAB** | Google Play Store bundle | — |
            | **iOS IPA** | Unsigned IPA for sideloading/testing | — |
            
            ### What's New
            - 🛡️ Crash-safe service initialization (TTS, NeuralEngine, Dictionary)
            - 🧭 Fixed navigation flow for role selection
            - 🎤 Voice translator improvements
            - 🧠 Whisper base multilingual model
            - 🔌 Fully offline — no Firebase dependency
          files: |
            build/app/outputs/flutter-apk/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-universal.apk
            build/app/outputs/flutter-apk/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-compact-arm64.apk
            build/app/outputs/bundle/release/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: iOS — IPA build (runs on macOS runner)
# ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-latest

    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── Determine edition name based on branch ─────────────────────────────
      - name: Set edition variables
        run: |
          if [ "${{ github.ref_name }}" = "speechmate_general" ]; then
            echo "EDITION=General" >> $GITHUB_ENV
            echo "APP_NAME=SpeechMate-General" >> $GITHUB_ENV
            echo "RELEASE_TITLE=SpeechMate General v${{ env.APP_VERSION }} (Public Edition)" >> $GITHUB_ENV
            echo "TAG_SUFFIX=-public" >> $GITHUB_ENV
          else
            echo "EDITION=Institutional" >> $GITHUB_ENV
            echo "APP_NAME=SpeechMate" >> $GITHUB_ENV
            echo "RELEASE_TITLE=SpeechMate v${{ env.APP_VERSION }} (Institutional Edition)" >> $GITHUB_ENV
            echo "TAG_SUFFIX=" >> $GITHUB_ENV
          fi

      - name: Verify LFS model
        run: |
          ls -lh assets/models/
          FILE_SIZE=$(stat -f%z assets/models/ggml-base.bin 2>/dev/null || echo 0)
          if [ "$FILE_SIZE" -lt 100000000 ]; then
            echo "LFS file incomplete, pulling..."
            git lfs pull
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      # Build iOS without code signing (no-codesign = unsigned IPA for testing/sideloading)
      # Flutter automatically runs pod install during build
      - name: Build iOS (no-codesign)
        run: flutter build ios --release --no-codesign

      # Package the .app into an IPA manually (works without Apple Developer account)
      - name: Package IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-ios.ipa Payload/

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-iOS-IPA
          path: build/ios/iphoneos/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-ios.ipa

      - name: Upload iOS IPA to Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.RELEASE_TITLE }}"
          tag_name: "v${{ env.APP_VERSION }}${{ env.TAG_SUFFIX }}"
          files: build/ios/iphoneos/${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
