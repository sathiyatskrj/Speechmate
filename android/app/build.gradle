plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
    // id("com.google.gms.google-services") // Firebase — disabled for offline demo
}

android {
    namespace = "com.speechmate.general"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.speechmate.general"
        minSdk = 24
        targetSdk = 35
        versionCode = 10 // Updated to match pubspec (1.5.0+10)
        versionName = "1.5.0" // Updated to match pubspec
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true   // Produces both per-ABI splits AND a universal APK
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

flutter {
    source = "../.."
}
dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
    // Firebase — disabled for offline demo. Re-enable post-proposal.
    // implementation platform('com.google.firebase:firebase-bom:34.7.0')
    // implementation 'com.google.firebase:firebase-analytics'

    // ─── ML Kit: bundle models inside APK (fully offline) ────────────────────
    // Image Labeling — bundles the default on-device model (~5MB)
    implementation 'com.google.mlkit:image-labeling:17.0.9'

    // Object Detection — stream-mode live object detection
    implementation 'com.google.mlkit:object-detection:17.0.2'

    // Text Recognition — bundles Latin + Devanagari scripts
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    // ─────────────────────────────────────────────────────────────────────────
}
