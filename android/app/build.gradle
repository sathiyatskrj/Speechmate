plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
    id("com.google.gms.google-services") // Added for Firebase
}

android {
    namespace = "com.speechmate.speechmate"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.speechmate.speechmate"
        minSdk = 24
        targetSdk = 34
        versionCode = 2 // Updated to match pubspec (1.2.0+2)
        versionName = "1.4.8" // Updated to match pubspec
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'  // Only modern 64-bit ARM; covers 95%+ of Android devices
            universalApk false   // No fat APK; per-ABI splits keep size minimal
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

flutter {
    source = "../.."
}
dependencies {
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.7.0')

    // Firebase products
    implementation 'com.google.firebase:firebase-analytics'

    // ─── ML Kit: bundle models inside APK (fully offline) ────────────────────
    // Image Labeling — bundles the default on-device model (~5MB)
    implementation 'com.google.mlkit:image-labeling:17.0.9'

    // Object Detection — stream-mode live object detection
    implementation 'com.google.mlkit:object-detection:17.0.2'

    // Text Recognition — bundles Latin + Devanagari scripts
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    // ─────────────────────────────────────────────────────────────────────────
}
